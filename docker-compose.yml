services:
  wedding-rsvp:
    build: .
    ports:
      # Bound to localhost only — on a VPS the public entrance is Caddy
      # (https profile) or a tunnel, never the bare Node server
      - "127.0.0.1:3000:3000"
    environment:
      # Change this before sharing the site!
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cainton-admin}
    volumes:
      # RSVPs live in ./data/wedding.db on your PC, so they survive
      # container rebuilds and restarts
      - ./data:/app/data
    restart: unless-stopped

  # Production on a VPS: Caddy terminates HTTPS for your domain with
  # automatic Let's Encrypt certificates.
  # 1. Point an A record for your (sub)domain at the VPS IP
  # 2. Set DOMAIN=rsvp.yourdomain.com in .env
  # 3. docker compose --profile https up -d --build
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wedding-rsvp
    restart: unless-stopped

  # Optional: expose the site to the internet with a free Cloudflare
  # quick tunnel (random URL, no account needed).
  # Start:            docker compose --profile public up -d
  # Get the URL:      docker compose logs tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: tunnel --no-autoupdate --url http://wedding-rsvp:3000
    depends_on:
      - wedding-rsvp
    restart: unless-stopped

  # Optional: permanent public URL on your own domain via a named
  # Cloudflare tunnel (free account required — create the tunnel in the
  # Cloudflare Zero Trust dashboard, point it at
  # http://wedding-rsvp:3000, and put its token in .env as TUNNEL_TOKEN).
  # Start:  docker compose --profile domain up -d
  tunnel-named:
    image: cloudflare/cloudflared:latest
    profiles: ["domain"]
    command: tunnel --no-autoupdate run
    environment:
      # Required for this profile — set it in .env
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - wedding-rsvp
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
